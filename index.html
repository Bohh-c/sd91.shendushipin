<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>深度视频❤️</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* ===== 视频层 ===== */
  #video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #video.show { opacity: 1; }

  /* ===== 加载 / 进入层 ===== */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 26px 20px calc(26px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(135deg, #ff9a2e, #ffb347 45%, #ff7a00);
    overflow: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }

  .loader::before {
    content: "";
    position: absolute;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    filter: blur(80px);
    top: -25vmax;
    left: -25vmax;
    pointer-events: none;
  }

  .loader::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    pointer-events: none;
  }

  .loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* ===== 广告条 ===== */
  .ad {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 92vw;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.38);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    color: #fff;
    font-size: 13px;
    letter-spacing: .5px;
    text-shadow: 0 1px 6px rgba(255, 110, 0, 0.35);
    box-shadow: 0 6px 20px rgba(255, 110, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: adFloat 3s ease-in-out infinite;
  }

  .ad-tag {
    flex: none;
    display: inline-block;
    padding: 1px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.9);
    color: #ff7a00;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: none;
  }

  .ad-text {
    display: inline-block;
    animation: adGlow 2.6s ease-in-out infinite;
  }

  @keyframes adGlow {
    0%, 100% { opacity: .86; }
    50%      { opacity: 1; }
  }

  @keyframes adFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* ===== 中间内容区 ===== */
  .loader-content {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 12px rgba(255, 120, 0, 0.35);
  }

  /* ===== 加载中 ===== */
  .loading-box { display: block; }

  .spinner {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 5px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    animation: spin .9s linear infinite;
    box-shadow: 0 0 28px rgba(255, 140, 0, 0.55);
  }

  .loader-text {
    font-size: 18px;
    letter-spacing: 1px;
    font-weight: 600;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 点击进入按钮 ===== */
  .enter-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 46px;
    border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 2px 10px rgba(255, 110, 0, 0.4);
    cursor: pointer;
    outline: none;
    box-shadow:
      0 10px 34px rgba(255, 110, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.65);
    opacity: 0;
    transform: scale(.9);
    transition: opacity .3s ease, transform .3s ease,
                background .2s ease, box-shadow .2s ease;
  }

  .enter-btn.in {
    opacity: 1;
    transform: scale(1);
    animation: breathe 2s ease-in-out infinite;
  }

  .enter-btn:active {
    background: rgba(255, 255, 255, 0.42);
    transform: scale(.97);
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 10px 34px rgba(255, 110, 0, 0.35), inset 0 1px 0 rgba(255,255,255,.65); }
    50%      { box-shadow: 0 10px 44px rgba(255, 110, 0, 0.65), inset 0 1px 0 rgba(255,255,255,.9); }
  }

  .enter-btn .heart {
    font-size: 17px;
    animation: beat 1.2s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }

  /* =====================================================
     模拟站点检测面板
     ===================================================== */
  .site-panel {
    display: none;
    width: min(420px, 92vw);
    margin-top: 22px;
  }

  .site-panel.in {
    display: block;
    animation: fadeUp .45s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .site-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 8px;
    font-size: 12px;
    letter-spacing: .5px;
    color: rgba(255, 255, 255, 0.82);
  }

  .site-head .hd-title { font-weight: 600; }

  .site-head .hd-count {
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.65);
  }

  .site-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .site-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.26);
    backdrop-filter: blur(8px) saturate(140%);
    -webkit-backdrop-filter: blur(8px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
    text-align: left;
    transition: background .3s ease, border-color .3s ease,
                box-shadow .3s ease, transform .3s ease;
  }

  .site-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    flex: none;
    transition: background .3s ease, box-shadow .3s ease;
  }

  /* 编号：等宽数字，像真实 ID */
  .site-id {
    flex: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #fff;
    opacity: .95;
    min-width: 62px;
  }

  /* 站点信息 */
  .site-info {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 延迟数值 */
  .site-ping {
    flex: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.7);
    min-width: 46px;
    text-align: right;
  }

  /* 状态文字 */
  .site-status {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    min-width: 32px;
    text-align: right;
  }

  /* 选中标记 */
  .site-check {
    display: none;
    flex: none;
    font-size: 12px;
    font-weight: 700;
    color: #b9f6ca;
  }

  /* --- 各状态配色 --- */
  .site-item[data-state="testing"] .site-dot {
    animation: dotPulse .7s ease-in-out infinite;
  }
  .site-item[data-state="testing"] .site-status {
    color: rgba(255, 255, 255, 0.65);
  }

  @keyframes dotPulse {
    0%, 100% { opacity: .35; transform: scale(.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  .site-item[data-state="smooth"] .site-dot {
    background: #4ade80;
    box-shadow: 0 0 9px rgba(74, 222, 128, .95);
  }
  .site-item[data-state="smooth"] .site-status { color: #b9f6ca; }

  .site-item[data-state="good"] .site-dot {
    background: #fbbf24;
    box-shadow: 0 0 9px rgba(251, 191, 36, .95);
  }
  .site-item[data-state="good"] .site-status { color: #ffe082; }

  .site-item[data-state="busy"] .site-dot {
    background: #f87171;
    box-shadow: 0 0 9px rgba(248, 113, 113, .95);
  }
  .site-item[data-state="busy"] .site-status { color: #ffb3b3; }

  /* 自动选中的最优线路 */
  .site-item.selected {
    background: rgba(255, 255, 255, 0.32);
    border-color: rgba(255, 255, 255, 0.92);
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.14),
      0 6px 22px rgba(255, 110, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transform: translateY(-1px);
  }
  .site-item.selected .site-check { display: inline; }
  .site-item.selected .site-id { color: #fff; }
</style>
</head>
<body>

  <!-- 加载 / 进入层 -->
  <div id="loader" class="loader">

    <!-- 中间：加载 / 进入 -->
    <div class="loader-content">

      <!-- 状态一：加载中 -->
      <div id="loadingBox" class="loading-box">
        <div class="spinner"></div>
        <div class="loader-text">正在加载中❤️</div>
      </div>

      <!-- 状态二：点击进入 -->
      <button id="enterBtn" class="enter-btn" type="button">
        <span class="heart">❤️</span>
        <span>点击进入</span>
      </button>

      <!-- 模拟站点面板 -->
      <div id="sitePanel" class="site-panel">
        <div class="site-head">
          <span class="hd-title" id="siteTitle">正在检测可用线路…</span>
          <span class="hd-count" id="siteCount">0/5</span>
        </div>
        <div class="site-list" id="siteList"></div>
      </div>

    </div>

  </div>

  <!-- 视频 -->
  <video id="video" playsinline webkit-playsinline preload="auto" controls>
    <source src="s.mp4" type="video/mp4">
    你的浏览器不支持 video 标签。
  </video>

<script>
  const video      = document.getElementById('video');
  const loader     = document.getElementById('loader');
  const loadingBox = document.getElementById('loadingBox');
  const enterBtn   = document.getElementById('enterBtn');
  const sitePanel  = document.getElementById('sitePanel');
  const siteList   = document.getElementById('siteList');
  const siteTitle  = document.getElementById('siteTitle');
  const siteCount  = document.getElementById('siteCount');
  let entered = false;

  /* =========================================================
     一、站点数据（编号 + 站点信息）
     ========================================================= */
  const SITES = [
    { id: '138420', info: '上海电信 · 华东节点' },
    { id: '207631', info: '广州联通 · 华南节点' },
    { id: '315928', info: '北京移动 · 华北节点' },
    { id: '462075', info: '成都电信 · 西南节点' },
    { id: '590314', info: '香港 CN2 · 国际出口' }
  ];

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // 延迟 → 状态
  function stateOf(delay) {
    if (delay <= 80)  return { key: 'smooth', label: '畅通' };
    if (delay <= 200) return { key: 'good',   label: '良好' };
    return { key: 'busy', label: '堵塞' };
  }

  // 生成延迟：保证至少有一条畅通
  function makeDelays(n) {
    const arr = [randInt(24, 68)];
    for (let i = 1; i < n; i++) arr.push(randInt(60, 480));
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const delays = makeDelays(SITES.length);

  // 构建 DOM
  SITES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'site-item';
    el.dataset.state = 'testing';
    el.dataset.delay = delays[i];
    el.innerHTML =
      '<span class="site-dot"></span>' +
      '<span class="site-id">' + s.id + '</span>' +
      '<span class="site-info">' + s.info + '</span>' +
      '<span class="site-ping">-- ms</span>' +
      '<span class="site-status">检测中</span>' +
      '<span class="site-check">✓</span>';
    siteList.appendChild(el);
  });

  const siteItems = siteList.querySelectorAll('.site-item');
  const total = siteItems.length;
  let doneCount = 0;

  // 逐个出结果
  siteItems.forEach((el, i) => {
    setTimeout(() => {
      const delay = Number(el.dataset.delay);
      const st = stateOf(delay);

      el.dataset.state = st.key;
      el.querySelector('.site-ping').textContent = delay + ' ms';
      el.querySelector('.site-status').textContent = st.label;

      doneCount++;
      siteCount.textContent = doneCount + '/' + total;
    }, 320 + i * 300);
  });

  // 全部完成 → 选最优（延迟最低）
  setTimeout(() => {
    let best = null;
    siteItems.forEach(el => {
      if (!best || Number(el.dataset.delay) < Number(best.dataset.delay)) {
        best = el;
      }
    });
    if (best) {
      best.classList.add('selected');
      siteTitle.textContent = '已自动选择最优线路';
    }
  }, 320 + total * 300 + 240);

  /* =========================================================
     二、最小加载时长 + 显示按钮
     ========================================================= */
  const MIN_LOADING_TIME = 2500;
  const startTime = Date.now();
  let videoReady = false;

  function tryShowEnter() {
    if (entered || !videoReady) return;
    const remain = MIN_LOADING_TIME - (Date.now() - startTime);
    if (remain > 0) setTimeout(showEnter, remain);
    else showEnter();
  }

  function showEnter() {
    if (entered) return;
    if (enterBtn.classList.contains('in')) return;

    loadingBox.style.display = 'none';
    enterBtn.style.display = 'inline-flex';

    requestAnimationFrame(() => {
      enterBtn.classList.add('in');
      sitePanel.classList.add('in');
    });
  }

  if (video.readyState >= 3) {
    videoReady = true;
    tryShowEnter();
  } else {
    video.addEventListener('canplay', () => {
      videoReady = true;
      tryShowEnter();
    }, { once: true });
  }

  /* =========================================================
     三、加载失败兜底
     ========================================================= */
  video.addEventListener('error', () => {
    const text = loader.querySelector('.loader-text');
    const spinner = loader.querySelector('.spinner');
    if (text) text.textContent = '视频加载失败，请刷新重试';
    if (spinner) spinner.style.animationPlayState = 'paused';
  });

  /* =========================================================
     四、点击进入
     ========================================================= */
  enterBtn.addEventListener('click', () => {
    if (entered) return;
    entered = true;

    loader.classList.add('hide');
    video.classList.add('show');

    video.muted = false;
    video.currentTime = 0;

    const p = video.play();
    if (p && p.catch) {
      p.catch(() => {
        video.muted = true;
        video.play().catch(() => {
          video.controls = true;
        });
      });
    }
  });

  document.addEventListener('keydown', (e) => {
    if (!entered && enterBtn.classList.contains('in') &&
        (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      enterBtn.click();
    }
  });
</script>

</body>
</html>
